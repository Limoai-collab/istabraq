<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>اختبار الإيميل</title>
<style>body{font-family:Tahoma,sans-serif;max-width:560px;margin:auto;padding:18px;line-height:1.9;background:#fff7fa;color:#4a2339}button{font:inherit;padding:12px 18px;border:0;border-radius:12px;background:#d81b60;color:#fff;margin:6px 0}pre{background:#fff;border:1px solid #f48fb1;border-radius:10px;padding:10px;white-space:pre-wrap;word-break:break-all}</style></head><body>
<h2>اختبار إرسال الإيميل</h2>
<p><b>الاختبار ١ (نموذج عادي):</b> اضغط الزر، وتفتح صفحة FormSubmit الرسمية. اقرأ ما يظهر فيها وأرسله لي (صورة شاشة).</p>
<form method="POST" action="https://formsubmit.co/chebuoktiz@gmail.com">
<input type="hidden" name="_subject" value="اختبار الإيميل 1"><input type="hidden" name="_template" value="table">
<input type="hidden" name="رسالة" value="تجربة من النموذج العادي">
<button type="submit">إرسال تجربة (نموذج)</button></form>
<p><b>الاختبار ٢ (نفس طريقة الصفحة):</b> اضغط الزر وانتظر، وسيظهر الرد هنا.</p>
<button id="b2">إرسال تجربة (AJAX)</button><pre id="out">—</pre>
<script>
document.getElementById('b2').onclick=async()=>{const o=document.getElementById('out');o.textContent='جاري الإرسال…';
try{const r=await fetch('https://formsubmit.co/ajax/chebuoktiz@gmail.com',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({_subject:'اختبار الإيميل 2',_captcha:'false','رسالة':'تجربة AJAX'})});
o.textContent='الحالة: '+r.status+'\n'+await r.text()}catch(e){o.textContent='فشل الاتصال: '+e}};
</script></body></html>
