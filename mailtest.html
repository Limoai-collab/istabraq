<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>اختبار الإيميل</title>
<style>body{font-family:Tahoma,sans-serif;max-width:560px;margin:auto;padding:18px;line-height:1.9;background:#fff7fa;color:#4a2339}button{font:inherit;padding:12px 18px;border:0;border-radius:12px;background:#d81b60;color:#fff;margin:6px 0}pre{background:#fff;border:1px solid #f48fb1;border-radius:10px;padding:10px;white-space:pre-wrap;word-break:break-all}</style></head><body>
<h2>اختبار إرسال الإيميل</h2>
<p>اضغط الزر وانتظر، وسيظهر الرد هنا. إذا كتب <b>success: true</b> فتفقّد جيميلك (وSpam).</p>
<button id="b">إرسال تجربة</button><pre id="out">—</pre>
<script>
document.getElementById('b').onclick=async()=>{const o=document.getElementById('out');o.textContent='جاري الإرسال…';
try{const r=await fetch('https://api.web3forms.com/submit',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({access_key:'1f4862ef-efa7-4554-a7cc-fc38bfa81d37',subject:'اختبار الإيميل',from_name:'اختبار','رسالة':'تجربة من صفحة الاختبار'})});
o.textContent='الحالة: '+r.status+'\n'+await r.text()}catch(e){o.textContent='فشل الاتصال: '+e}};
</script></body></html>
